# Supabase CLI configuration for local development (`supabase start`).
# Production auth settings are configured in the Supabase dashboard;
# see docs/deployment.md for the required values.
project_id = "devhub-hq"

[api]
enabled = true
port = 54321
# Only `public` is exposed through PostgREST. The `app` schema (authorization
# helpers, retention) is deliberately not exposed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Local convenience only. Disable sign-up in production.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
